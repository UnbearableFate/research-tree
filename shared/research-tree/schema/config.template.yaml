# research-tree 项目配置（version 3）。
# /research-tree config 可在初始化前复制本文件（不覆盖已有文件）。编辑后 init；立项确认时登记为生效版本。之后修改本文件，
# 运行 /research-tree config apply 才会生效（登记为用户指令与新版本配置，并通知 RLD）。
# 阈值都是示例值：按你的研究计划填写；看到实验结果之后不能由 agent 调低。
version: 3

# 开发与实验在哪里、怎么运行。文字原样交给 RLD 和每个 worker。
platform:
  dev: |
    在当前机器上运行。
  experiment: |
    在当前机器上运行。
  # worker 预加载的站点技能（例如集群调度技能）。站点技能对插件的最小义务：
  #   1. 提交前用 reserve_submission / claim_submission 取得提交身份（submission_key），提交时带上它，
  #      提交后立即 attach_job 并 update_run(submitted)；job_id 可被调度器再次查询。
  #   2. 查询失败或提交超时保持 unknown，不重提（接口拒绝从 unknown 重提），按 submission_key 核对。
  #   3. 作业结束后填实际用量，并用调度器的用量文件 settle_reservation；来源可追溯。
  #   4. 唤醒后只核对原作业与导入结果，把控制交回 RLD；不作判定、不自动验收。
  #   5. 不修改 research-tree.yaml、已生效文档与冻结框架。
  skills: []

# 唯一流程：先做有预算上限的有效筛选，逐候选准入，最终 GO 必须独立确认。
# 版本 1/2 与旧数据库不兼容；保留原项目证据，用本模板建立并重新授权新项目。
# 设计与提交保护；普通廉价筛选不等待逐次模型审查。
design:
  code_review: true           # 对关键候选/确认保留代码审查，普通廉价筛选不等模型评审
  sanity_first: true
  overrun_factor: 2.0         # 实际用量达到预估的倍数，写待处理项（不取消作业）

evidence_policy:
  require_artifact_import: true

# 指标规范：第一个为主指标。init 把它登记为 metric_spec 文档；主指标的 minimum_practical_gain 就是优于 SOTA 的门槛。
metric_specs:
  - name: accuracy
    direction: higher
    input_unit: fraction
    canonical_unit: percentage_point
    effect_mode: absolute
    minimum_practical_gain: 0.2
    aggregation: paired_run_mean
    valid_range: [0.0, 1.0]
  - name: train_time_s
    direction: lower
    input_unit: seconds
    canonical_unit: seconds
    effect_mode: relative_to_reference_mean
    relative_min_denominator: 1.0
    allowed_regression: 0.10
    minimum_practical_gain: 0.0
    aggregation: paired_run_mean

# seed 层级：筛选 + 复制 = 统一 seed（判定所需的配对数）；确认 seed 只在独立确认时使用。
verification:
  screening_seeds: [42]
  replication_seeds: [43, 44]
  confirmation_seeds: [1042, 1043, 1044]
  min_confirmation_pairs: 3
  max_confirmation_candidates: 2
  # 命名的确认材料（S2）：每份是评测切分（内容哈希 split_sha256，runner 在 manifest 的 manifest_field 中报告）与训练 seed 块；
  # 确认批次各用一份，用过的材料不能给反馈之后的新候选再用。为空时只有一份由 confirmation_seeds 构成的材料。
  confirmation_materials: []
  # 可选：manifest 中标识独立重复单元的字段。
  independence_fields: []
  # 只读追加重复建议；不会自动预留或提交，seed_pool 必须属于上面的搜索 seeds。
  repetition: {enabled: false, se_multiple: 2.0, batch: 2, seed_pool: []}

# 资源预算。用量按 node-seconds 记（节点数 × 墙钟秒）；单机实验把整台机器算作 1 个节点。
budget:
  per_run: {nodes: 8, walltime: 1h}
  total_limit: null           # 授权总量（node-seconds）；null 只有提醒、不封顶。例：360000 = 100 node·h
  search_limit: null          # 其中探索
  confirmation_limit: null    # 其中独立确认（总量的一部分）
  repair_limit: null          # 其中修复
  screen_node_h: 10           # 筛选预算：按 SOTA 第一个 seed 的成本决定筛选实验的 seed 数
  max_parallel_workers: null
  alert_node_h: null
  review_usd_alert: null      # 累计评审费用提醒阈值（M4 起）

search:
  exploration_fraction: 0.15
  max_repairs_per_root_cause: 2   # 同一根因至多几次补丁（失败预算，之后至多 2 次重写）
  require_selection_rationale: true
  allow_repair_from_retired_evidence: true
  stall_structural_at: 2
  stall_human_at: 4

memory:
  enabled: true
  max_items_per_task: 5
  include_counterevidence: true
  pack_limit_chars: 8000      # 上下文包的字符上限

# 外部通知（可选）：确认请求与用量提醒时向这个地址 POST JSON；超时不等于同意。
notify:
  url: null
  timeout_s: 10

models:
  # 可用易读名称（忽略大小写），如 Haiku 5 / Haiku 5.5 → claude-haiku-5-5、Sonnet 5.5 → claude-sonnet-5-5。
  # 正式 ID 原样使用；reviewer 的 Claude 易读名称会自动补 anthropic/。
  # Codex 示例：GPT 6 Luna → gpt-6-luna、GPT 6.1 Sol → gpt-6.1-sol；reviewer 自动补 openai/。
  ui: {model: inherit, effort: null}
  worker: {model: inherit, effort: null}
  explorer: {model: inherit, effort: null}
  architect: {model: inherit, effort: null}
  analyst: {model: inherit, effort: null}
  reviewer:                   # 基座按 provider 自动选择：anthropic/* → Claude Code CLI，其余 → pi
    model: openai/gpt-6-astra
    thinking: high
    require_cross_family: true
    timeout_s: 900
